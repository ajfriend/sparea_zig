name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Run on macOS so kcov uses libdwarf (which parses Zig 0.15+ DWARF 5);
    # on Linux kcov uses libdw and reports 0% coverage on Zig binaries.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        zig:
          - "0.15.2"  # matches minimum_zig_version in build.zig.zon
          - "0.16.0"  # latest stable
          - "master"  # tracks Zig nightly; allowed to fail
    continue-on-error: ${{ matrix.zig == 'master' }}
    name: zig ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install kcov + jq + just
        run: brew install kcov jq just

      - name: just test
        run: just test
