name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04  # jammy still ships the `kcov` apt package; removed from 24.04
    strategy:
      fail-fast: false
      matrix:
        zig:
          - "0.15.2"  # matches minimum_zig_version in build.zig.zon
          - "0.16.0"  # latest stable
          - "master"  # tracks Zig nightly; allowed to fail
    continue-on-error: ${{ matrix.zig == 'master' }}
    name: zig ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install kcov + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov jq

      - uses: extractions/setup-just@v2

      - name: kcov version
        run: kcov --version

      - name: just test
        run: just test

      - name: list coverage dir on failure
        if: failure()
        run: ls -laR coverage || true
