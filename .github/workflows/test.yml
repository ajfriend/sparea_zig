name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig:
          - "0.15.2"  # matches minimum_zig_version in build.zig.zon
          - "0.16.0"  # latest stable
          - "master"  # tracks Zig nightly; allowed to fail
    continue-on-error: ${{ matrix.zig == 'master' }}
    name: zig ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      # Coverage is enforced locally via `just test` (kcov works on macOS
      # via libdwarf). On Linux, kcov uses libdw which mis-parses Zig's
      # DWARF 5; on hosted macOS runners ptrace/SIP friction hangs the
      # run. CI here just verifies the test suite passes across the matrix.
      - name: zig build test
        run: zig build test

  # Regression guard for the windows-msvc `sincos` issue: LLVM fuses
  # adjacent @sin/@cos on the same value into a sincos() call, but
  # MSVC's libm has no sincos. `src/windows_sincos.zig` provides the
  # symbol; this job re-links the test binary against MSVC's libm to
  # catch a regression at the link stage.
  windows-msvc-link:
    name: windows-msvc link
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: zig build test -Dtarget=x86_64-windows-msvc
        run: zig build test -Dtarget=x86_64-windows-msvc
