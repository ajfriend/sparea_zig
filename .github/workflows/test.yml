name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig:
          - "0.15.2"  # matches minimum_zig_version in build.zig.zon
          - "0.16.0"  # latest stable
          - "master"  # tracks Zig nightly; allowed to fail
    continue-on-error: ${{ matrix.zig == 'master' }}
    name: zig ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install jq + kcov build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq cmake libdw-dev libcurl4-openssl-dev binutils-dev libiberty-dev

      - name: Build and install kcov v43
        run: |
          # apt kcov was dropped from Ubuntu 24.04, and the 22.04 version (38)
          # is too old to read Zig's DWARF. Build from source.
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov/build

      - uses: extractions/setup-just@v2

      - name: just test
        run: just test
