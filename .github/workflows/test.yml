name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig:
          - "0.15.2"  # matches minimum_zig_version in build.zig.zon
          - "0.16.0"  # latest stable
          - "master"  # tracks Zig nightly; allowed to fail
    continue-on-error: ${{ matrix.zig == 'master' }}
    name: zig ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      # Coverage is enforced locally via `just test`. CI only verifies the
      # suite runs across the Zig matrix — kcov on Linux uses libdw, which
      # mis-parses Zig's DWARF 5 and reports 0% even when all tests run.
      - name: zig build test
        run: zig build test
